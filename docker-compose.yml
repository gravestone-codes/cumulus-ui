services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: cumulus
      POSTGRES_USER: cumulus
      POSTGRES_PASSWORD: cumulus
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # Host 5433: local Postgres.app keeps 5432 for other projects.
      - '5433:5432'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://cumulus:cumulus@db:5432/cumulus
      SWITCH_CRED_KEY: change-me-in-production-32-chars-min
    ports:
      - '3000:3000'
    depends_on:
      - db

volumes:
  pgdata: {}
