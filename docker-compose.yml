services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: cumulus
      POSTGRES_USER: cumulus
      POSTGRES_PASSWORD: cumulus
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # Host 5433: local Postgres.app keeps 5432 for other projects.
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cumulus -d cumulus']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://cumulus:cumulus@db:5432/cumulus
      STATIC_DIR: /app/public
      # Real key lives in the server's gitignored .env; the default is dev-only.
      SWITCH_CRED_KEY: ${SWITCH_CRED_KEY:-change-me-in-production-32-chars-min}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}
